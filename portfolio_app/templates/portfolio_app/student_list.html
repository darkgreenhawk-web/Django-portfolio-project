{% extends "portfolio_app/base_template.html" %}

{% block content %}

<h2>Students</h2>

<ul>
    {% for student in students %}
    <a href="{% url 'student-detail' student.pk %}">
        <li>{{ student.name }}</li>
    </a>
    {% empty %}
        <li>No students found.</li>
    {% endfor %}
    <a href="{% url 'student-create' %}">
    Add Student
</a>

</ul>

{% endblock %}
