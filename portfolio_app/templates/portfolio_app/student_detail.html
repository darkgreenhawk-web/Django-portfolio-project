{% extends "portfolio_app/base_template.html" %}

{% block content %}

<h2>{{ student.name }}</h2>

<p>Email: {{ student.email }}</p>
<p>Major: {{ student.get_major_display }}</p>

{% if student.portfolio %}
    <p><a href="{% url 'portfolio-detail' student.portfolio.pk %}">View Portfolio</a></p>
{% else %}
    <p>No portfolio yet.</p>
{% endif %}

<a href="{% url 'index' %}">Home</a> |
<a href="{% url 'student-list' %}">Back to Students</a>

{% endblock %}
